# RESPALDO del keep-alive. El ping principal lo hace UptimeRobot cada 5 min contra
# /health/db: los `schedule` de GitHub no son fiables (en la práctica se ejecutaban
# cada 6-9 h en vez de cada 10 min), así que Render free (se duerme tras ~15 min)
# no se mantenía despierto solo con esto.
#
# Este workflow queda cada hora como red de seguridad, sobre todo para Supabase
# (free tier se pausa tras 7 días sin actividad) si UptimeRobot dejara de funcionar.
#
# Configuración: en GitHub → Settings → Secrets and variables → Actions,
# crear el secret HEALTHCHECK_URL con la URL pública, ej:
#   https://shift-management-1-n8hg.onrender.com/health/db
name: Keep alive

on:
  schedule:
    # Cada hora (GitHub puede retrasar o saltarse ejecuciones programadas)
    - cron: '23 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (server + database)
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::Falta el secret HEALTHCHECK_URL"
            exit 1
          fi
          # --retry cubre el cold start de Render (puede tardar ~30-60s en despertar)
          curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
               "$HEALTHCHECK_URL"
