# Mantiene despiertos el servidor de Render (free tier se duerme tras ~15 min sin tráfico)
# y la base de datos de Supabase (free tier se pausa tras 7 días sin actividad).
#
# Configuración: en GitHub → Settings → Secrets and variables → Actions,
# crear el secret HEALTHCHECK_URL con la URL pública, ej:
#   https://tu-api.onrender.com/health/db
name: Keep alive

on:
  schedule:
    # Cada 10 minutos (GitHub puede retrasar ejecuciones algunos minutos en horas pico)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (server + database)
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "::error::Falta el secret HEALTHCHECK_URL"
            exit 1
          fi
          # --retry cubre el cold start de Render (puede tardar ~30-60s en despertar)
          curl --fail --silent --show-error \
               --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
               "$HEALTHCHECK_URL"
