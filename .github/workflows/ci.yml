# Integración continua: valida backend y frontend en cada push a main y en cada PR.
# El backend corre los tests e2e contra un PostgreSQL real (migraciones + seed),
# así cualquier regresión de seguridad de la auditoría hace fallar el pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shift_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shift_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shift_ci
      JWT_SECRET: ci-only-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # misma versión que el Dockerfile de producción
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Prisma schema y migraciones sincronizados
        run: npx prisma migrate deploy && npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run format:check
      - run: npm run lint:check
      - name: Tests unitarios
        run: npm test -- --ci
      - run: npm run build
      - name: Tests e2e (PostgreSQL real)
        run: npx prisma db seed && npm run test:e2e -- --ci

  client:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Typecheck + build
        run: npm run build
